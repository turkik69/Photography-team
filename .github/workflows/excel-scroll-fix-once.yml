name: Apply Excel theme and scroll fixes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/excel-scroll-fix-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/patch_excel_scroll.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">([\s\S]*?)</script>',s)
          if not m: raise SystemExit('module script not found')
          Path('/tmp/app.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.mjs
      - name: Commit fixes
        run: |
          git config user.name "Turki alyahyai"
          git config user.email "turki.k69@gmail.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Style Excel reports and fix long-page scrolling"
          git push origin HEAD:main
