name: Apply structured reports redesign
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch report UI and exports
        run: python tools/patch_reports.py
      - name: Validate JavaScript syntax approximately
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'function selectedReportContentType()' in s
          assert 'function tasksStructuredReport(data)' in s
          assert 'function visitsStructuredReport(data)' in s
          assert 'data-report-content' in s
          print('Report patch markers OK')
          PY
      - name: Commit patched reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Redesign reports as structured tables with selectable report types"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
