<style>
/* ============================================================
   منصة فريق التصوير - بلدية مسقط
   نظام التصميم - Design Tokens
   ============================================================ */
:root{
  --green-950:#122E24;
  --green-900:#1A3B2C;
  --green-800:#224937;
  --green-700:#2D5B46;
  --green-600:#3D7159;
  --green-500:#4E8770;
  --green-100:#E2ECE5;
  --green-50:#F1F6F2;
  --gold-700:#96721E;
  --gold-600:#B8862E;
  --gold-500:#CB9C3C;
  --gold-100:#F6ECD6;
  --gold-50:#FBF6EA;
  --ink-900:#171F1B;
  --ink-700:#38423C;
  --ink-500:#616E67;
  --ink-300:#93A199;
  --line:#E4E1D4;
  --line-strong:#CFCBB8;
  --paper:#FFFFFF;
  --paper-50:#FAF7EE;
  --paper-100:#F2EDDD;
  --red-700:#9A2E22;
  --red-600:#C0392B;
  --red-100:#FBE7E4;
  --amber-700:#8A5A12;
  --amber-600:#C97A1F;
  --amber-100:#FBEDD8;
  --blue-600:#2461A8;
  --blue-100:#E3EEF9;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:20px;
  --shadow-1:0 1px 2px rgba(21,30,26,.06), 0 1px 1px rgba(21,30,26,.04);
  --shadow-2:0 6px 20px rgba(11,59,46,.10), 0 2px 6px rgba(11,59,46,.06);
  --shadow-3:0 14px 40px rgba(11,59,46,.16), 0 4px 12px rgba(11,59,46,.08);
  --maxw:960px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Cairo',system-ui,-apple-system,sans-serif;
  background:var(--paper-50);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  min-height:100dvh;
}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:0}
p{margin:0}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
ul{margin:0;padding:0;list-style:none}
img{max-width:100%;display:block}
::selection{background:var(--green-100);color:var(--green-900)}

/* ---------- Layout shells ---------- */
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.container{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 16px}
.portal-main{flex:1;padding:18px 0 96px;width:100%}

/* ---------- Topbar ---------- */
.topbar{
  background:linear-gradient(180deg,var(--green-900),var(--green-800));
  color:#fff;position:sticky;top:0;z-index:40;
  box-shadow:0 2px 10px rgba(10,47,36,.25);
}
.topbar-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.topbar-logo{width:38px;height:38px;border-radius:50%;background:#fff;flex:none;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.topbar-logo img{width:100%;height:100%;object-fit:cover}
.topbar-titles{flex:1;min-width:0}
.topbar-titles h1{font-size:15px;color:#fff;line-height:1.3}
.topbar-titles span{font-size:11.5px;color:var(--green-100);opacity:.85}
.topbar-user{display:flex;align-items:center;gap:8px;position:relative}
.topbar-avatar{width:34px;height:34px;border-radius:50%;background:var(--gold-600);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:none;padding:0;overflow:hidden;cursor:pointer}
.topbar-bell{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;position:relative}
.topbar-bell svg{width:18px;height:18px}
.notif-badge{position:absolute;top:-2px;left:-2px;background:var(--red-600);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--green-900)}
.notif-item{display:block;width:100%;text-align:right;background:#fff;border:none;border-bottom:1px solid var(--line);padding:11px 14px;cursor:pointer}
.notif-item:last-child{border-bottom:none}
.notif-item:active{background:var(--paper-50)}
.notif-item.unread{background:var(--green-50)}
.notif-item.unread:active{background:var(--green-100)}
.topbar-menu{
  position:absolute;top:44px;left:0;background:#fff;color:var(--ink-900);
  border-radius:var(--radius-m);box-shadow:var(--shadow-3);min-width:200px;
  overflow:hidden;border:1px solid var(--line);z-index:50;
}
.topbar-menu button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:right;
  padding:12px 14px;background:none;border:none;font-size:14px;color:var(--ink-900);cursor:pointer;
}
.topbar-menu button:hover{background:var(--paper-50)}
.topbar-menu .menu-divider{height:1px;background:var(--line);margin:4px 0}
.topbar-menu .danger{color:var(--red-600)}

/* ---------- Bottom nav (mobile) ---------- */
.bottomnav{
  position:fixed;bottom:0;right:0;left:0;z-index:40;
  background:linear-gradient(180deg,var(--green-800),var(--green-950));
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:4px;
  box-shadow:0 -4px 18px rgba(6,30,23,.35);
}
.bottomnav-inner{display:flex;justify-content:space-around;width:100%;max-width:var(--maxw)}
.navitem{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:none;color:var(--ink-500);cursor:pointer;
  padding:6px 8px;border-radius:var(--radius-s);flex:1;max-width:110px;
}
.navitem svg{width:21px;height:21px}
.navitem span{font-size:10.5px;font-weight:600}
.navitem.active{color:var(--green-700)}
.bottomnav .navitem{color:rgba(237,244,240,.65)}
.bottomnav .navitem svg{width:25px;height:25px}
.bottomnav .navitem span{font-size:11.5px;font-weight:700}
.bottomnav .navitem.active{color:#fff;background:rgba(203,156,60,.28)}
.bottomnav .navitem.active svg{color:var(--gold-500)}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:var(--radius-s);border:none;cursor:pointer;
  font-weight:700;font-size:14.5px;transition:transform .06s ease,box-shadow .15s ease,background .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--green-700);color:#fff;box-shadow:var(--shadow-1)}
.btn-primary:hover{background:var(--green-800)}
.btn-gold{background:var(--gold-600);color:#fff}
.btn-gold:hover{background:var(--gold-700)}
.btn-outline{background:#fff;color:var(--green-800);border:1.5px solid var(--line-strong)}
.btn-outline:hover{border-color:var(--green-700);background:var(--green-50)}
.btn-ghost{background:transparent;color:var(--ink-700)}
.btn-ghost:hover{background:var(--paper-100)}
.btn-danger{background:#fff;color:var(--red-600);border:1.5px solid var(--red-100)}
.btn-danger:hover{background:var(--red-100)}
.btn-blue{background:var(--blue-100);color:var(--blue-600)}
.btn-blue:hover{background:#D6E5F3}
.btn-tan{background:var(--gold-100);color:var(--gold-700)}
.btn-tan:hover{background:#F0E2C4}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px;flex:none}
.fab{
  position:fixed;left:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:39;
  width:54px;height:54px;border-radius:50%;background:var(--green-700);color:#fff;
  border:none;box-shadow:var(--shadow-3);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.fab svg{width:24px;height:24px}
@media(min-width:860px){.fab{bottom:24px}}

/* ---------- Cards & sections ---------- */
.card{background:#fff;border-radius:var(--radius-m);border:1px solid var(--line);box-shadow:var(--shadow-1)}
.card-pad{padding:16px}
.section{background:#fff;border-radius:var(--radius-m);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow-1);margin-bottom:14px}
.section-head{
  background:linear-gradient(90deg,var(--green-800),var(--green-700));
  color:#fff;padding:12px 16px;font-size:14.5px;font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.section-head.gold{background:linear-gradient(90deg,var(--gold-700),var(--gold-600))}
.section-body{padding:16px}
.stat-card{
  background:#fff;border-radius:var(--radius-m);border:1px solid var(--line);
  padding:14px 16px;border-right:4px solid var(--green-600);box-shadow:var(--shadow-1);
  display:flex;flex-direction:column;gap:4px;min-width:0;
}
.stat-card .num{font-size:26px;font-weight:800;color:var(--green-900);line-height:1}
.stat-card .lbl{font-size:12.5px;color:var(--ink-500);font-weight:600}
.stat-card.urgent{border-color:var(--red-600)}
.stat-card.gold{border-color:var(--gold-600)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.stat-grid{grid-template-columns:repeat(4,1fr)}}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink-700);margin-bottom:6px}
.field .hint{font-size:11.5px;color:var(--ink-300);margin-top:4px}
.input,select.input,textarea.input{
  width:100%;padding:12px 13px;border-radius:var(--radius-s);border:1.5px solid var(--line-strong);
  font-size:14.5px;background:#fff;color:var(--ink-900);
}
.input:focus,select.input:focus,textarea.input:focus{outline:none;border-color:var(--green-600);box-shadow:0 0 0 3px var(--green-100)}
textarea.input{resize:vertical;min-height:78px}
.row2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.row2{grid-template-columns:1fr 1fr}}
.row3{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.row3{grid-template-columns:1fr 1fr 1fr}}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:560px){.check-grid{grid-template-columns:1fr 1fr 1fr}}
.check-tile{
  display:flex;align-items:center;gap:9px;border:1.5px solid var(--line-strong);border-radius:var(--radius-s);
  padding:10px 11px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-700);background:#fff;
}
.check-tile input{width:17px;height:17px;accent-color:var(--green-700);flex:none}
.check-tile.on{border-color:var(--green-600);background:var(--green-50);color:var(--green-900)}
.check-tile svg{width:18px;height:18px;flex:none;color:var(--green-700)}
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.radio-pill{
  padding:9px 16px;border-radius:999px;border:1.5px solid var(--line-strong);font-size:13px;font-weight:700;
  cursor:pointer;background:#fff;color:var(--ink-700);
}
.radio-pill.on.urgent{background:var(--red-600);border-color:var(--red-600);color:#fff}
.radio-pill.on.medium{background:var(--amber-600);border-color:var(--amber-600);color:#fff}
.radio-pill.on.prescheduled{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.err-text{color:var(--red-600);font-size:12.5px;font-weight:700;margin-top:8px}
.input.field-invalid{border-color:var(--red-600);background:var(--red-100)}
.field-error-msg{color:var(--red-600);font-size:11.5px;font-weight:700;margin-top:5px;display:flex;align-items:center;gap:4px}
.field-error-msg svg{width:13px;height:13px;flex:none}
.form-actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.badge-urgent{background:var(--red-100);color:var(--red-700)}
.badge-medium{background:var(--amber-100);color:var(--amber-700)}
.badge-prescheduled{background:var(--blue-100);color:var(--blue-600)}
.badge-status-submitted{background:var(--amber-100);color:var(--amber-700)}
.badge-status-received{background:var(--blue-100);color:var(--blue-600)}
.badge-status-assigned{background:var(--gold-100);color:var(--gold-700)}
.badge-status-completed{background:var(--green-100);color:var(--green-800)}
.badge-role-lead{background:var(--gold-100);color:var(--gold-700)}
.badge-role-member{background:var(--green-100);color:var(--green-800)}

/* ---------- Lists ---------- */
.list-item{
  display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);
  background:#fff;cursor:pointer;
}
.list-item:last-child{border-bottom:none}
.list-item:active{background:var(--paper-50)}
.list-item-icon{
  width:38px;height:38px;border-radius:10px;background:var(--green-50);color:var(--green-700);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.list-item-icon svg{width:19px;height:19px}
.list-item-body{flex:1;min-width:0}
.list-item-title{font-size:14.5px;font-weight:700;color:var(--ink-900);margin-bottom:3px}
.list-item-sub{font-size:12.5px;color:var(--ink-500);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.list-item-chev{color:var(--ink-300);flex:none;margin-top:8px}
.list-item-chev svg{width:16px;height:16px}
.empty-state{padding:44px 20px;text-align:center;color:var(--ink-500)}

/* ---------- Bar charts (تقارير) ---------- */
.bar-chart{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:9px}
.bar-row .bar-label{font-size:12px;font-weight:700;color:var(--ink-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:14px;background:var(--paper-100);border-radius:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:7px;background:var(--green-600);transition:width .4s ease}
.bar-row .bar-value{font-size:12.5px;font-weight:800;color:var(--ink-900);text-align:left}

/* ---------- Task cards (responsive grid) ---------- */
.card-grid{display:flex;flex-direction:column;gap:10px}
@media(min-width:640px){.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}}
@media(min-width:960px){.card-grid{grid-template-columns:repeat(3,1fr)}}
.grid-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius-m);
  padding:13px 15px;box-shadow:var(--shadow-1);cursor:pointer;
}
.grid-card:active{background:var(--paper-50)}
.grid-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.grid-card-title{font-size:13.5px;font-weight:700;color:var(--ink-900);line-height:1.45}
.grid-card-sub{font-size:11px;color:var(--ink-500);margin-top:6px}
.empty-state svg{width:44px;height:44px;color:var(--line-strong);margin:0 auto 12px}
.empty-state h3{font-size:15px;color:var(--ink-700);margin-bottom:6px}
.empty-state p{font-size:13px;line-height:1.6}

/* ---------- Filters/tabs ---------- */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;cursor:grab;user-select:none}
.chiprow.dragging{cursor:grabbing}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:8px 15px;border-radius:999px;border:1.5px solid var(--line-strong);background:#fff;
  font-size:13px;font-weight:700;color:var(--ink-700);cursor:pointer;white-space:nowrap;
}
.chip.on{background:var(--green-800);border-color:var(--green-800);color:#fff}
.searchbar{position:relative;margin-bottom:12px}
.searchbar svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-300)}
.searchbar input{padding-right:38px}

/* ---------- Modal/Sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,30,24,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center}}
.sheet{
  background:#fff;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
}
@media(min-width:640px){.sheet{border-radius:var(--radius-l)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h3{font-size:16.5px}
.sheet-close{background:var(--paper-100);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-700)}

  display:flex;flex-direction:column;align-items:center;padding:0 18px;position:relative;overflow:hidden;
}
.hero-rings{position:absolute;top:-60px;left:50%;transform:translateX(-50%);opacity:.12;pointer-events:none}
.hero-top{padding-top:calc(48px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;z-index:1}
.hero-logo{width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.25);overflow:hidden}
.hero-logo img{width:100%;height:100%;object-fit:cover}
.hero-top h1{color:#fff;font-size:19px;text-align:center;line-height:1.4}
.hero-top .dept{color:var(--gold-500);font-size:13px;font-weight:700}
.hero-card{
  background:#fff;border-radius:var(--radius-l) var(--radius-l) 0 0;width:100%;max-width:460px;
  margin-top:26px;padding:26px 22px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2);
  position:relative;z-index:1;flex:1;
}
@media(min-width:520px){.hero-card{border-radius:var(--radius-l);margin-bottom:40px}}
.tabswitch{display:flex;background:var(--paper-100);border-radius:999px;padding:4px;margin-bottom:20px}
.tabswitch button{flex:1;border:none;background:none;padding:10px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--ink-500);cursor:pointer}
.tabswitch button.on{background:var(--green-800);color:#fff}
.linkrow{text-align:center;margin-top:14px;font-size:13px;color:var(--ink-500)}
.linkrow a,.linkrow button{color:var(--green-700);font-weight:700;background:none;border:none;cursor:pointer;font-size:13px;padding:0}

/* ---------- Detail page ---------- */
.detail-hero{padding:18px 16px;background:#fff;border-bottom:1px solid var(--line);margin-bottom:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-500);font-weight:600}
.kv .v{color:var(--ink-900);font-weight:700;text-align:left}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag-list span{background:var(--green-50);color:var(--green-800);font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.progress-steps{display:flex;align-items:center;gap:4px;margin:6px 0 2px}
.pstep{flex:1;height:6px;border-radius:4px;background:var(--line)}
.pstep.done{background:var(--green-600)}

/* ---------- Site rows (visit builder) ---------- */
.site-row{border:1.5px solid var(--line-strong);border-radius:var(--radius-m);padding:14px;margin-bottom:12px;position:relative;background:var(--paper-50)}
.site-row .site-num{
  position:absolute;top:-10px;right:12px;background:var(--green-700);color:#fff;font-size:11px;font-weight:800;
  padding:2px 10px;border-radius:999px;
}
.site-remove{position:absolute;top:10px;left:10px;background:#fff;border:1px solid var(--line-strong);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--red-600)}

/* ---------- Misc ---------- */
.spinner{width:34px;height:34px;border:3px solid var(--green-100);border-top-color:var(--green-700);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--paper-50)}
.toast{
  position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));right:50%;transform:translateX(50%);
  background:var(--ink-900);color:#fff;padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:700;
  box-shadow:var(--shadow-3);z-index:80;display:flex;align-items:center;gap:8px;max-width:90%;
}
.toast.error{background:var(--red-700)}
.toast svg{width:16px;height:16px;flex:none}
.section-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title-row h2{font-size:16.5px;color:var(--ink-900)}
.muted{color:var(--ink-500);font-size:13px}
.divider{height:1px;background:var(--line);margin:14px 0}
.avatar-sm{width:28px;height:28px;border-radius:50%;background:var(--green-100);color:var(--green-800);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none;overflow:hidden}
.center-pad{padding:40px 20px;text-align:center}

/* ---------- النشرة الشهرية ---------- */
.nl-sheet{background:#fff;border-radius:var(--radius-l);box-shadow:var(--shadow-2);overflow:hidden;margin-bottom:24px}
.nl-header{background:linear-gradient(135deg,var(--green-900),var(--green-700));position:relative;overflow:hidden}
.nl-header-bar{position:absolute;inset:0;background:radial-gradient(600px 200px at 100% 0%,rgba(203,156,60,.25),transparent 70%)}
.nl-header-row{position:relative;padding:30px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.nl-title h1{color:#fff;font-size:21px;font-weight:800;margin-bottom:5px}
.nl-title p{color:rgba(255,255,255,.75);font-size:12px}
.nl-period-badge{background:var(--gold-600);color:#fff;font-weight:800;font-size:13px;padding:8px 18px;border-radius:999px;white-space:nowrap}
.nl-section{padding:22px;border-bottom:1px dashed var(--line)}
.nl-section:last-of-type{border-bottom:none}
.nl-section h2{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:800;color:var(--green-900);margin-bottom:14px}
.nl-section h2 svg{width:18px;height:18px;color:var(--gold-600)}
.nl-total{color:var(--gold-600);font-weight:800}
.nl-stat-row{display:flex;flex-wrap:wrap;gap:10px}
.nl-stat-chip{background:var(--paper-50);border:1px solid var(--line);border-radius:var(--radius-m);padding:10px 16px;text-align:center;min-width:88px}
.nl-stat-num{display:block;font-size:20px;font-weight:800;color:var(--green-800)}
.nl-stat-lbl{display:block;font-size:11px;color:var(--ink-500);margin-top:2px}
.nl-list{list-style:none;display:flex;flex-direction:column;gap:9px}
.nl-list li{font-size:13px;color:var(--ink-900);padding-right:16px;position:relative}
.nl-list li::before{content:'';position:absolute;right:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--gold-600)}
.nl-muted{color:var(--ink-500);font-weight:400}
.nl-coverage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.nl-coverage-item{background:var(--paper-50);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px}
.nl-coverage-item strong{color:var(--green-800);font-size:12px}
.nl-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.nl-photo-frame{margin:0;border:6px solid #fff;outline:2px solid var(--gold-500);border-radius:6px;box-shadow:var(--shadow-1);overflow:hidden;break-inside:avoid}
.nl-photo-frame img{width:100%;height:150px;object-fit:cover;display:block}
.nl-photo-frame figcaption{padding:7px 9px;font-size:10.5px;color:var(--ink-500);text-align:center;background:#fff}
.nl-footer{padding:16px 22px;text-align:center;font-size:10.5px;color:var(--ink-500);background:var(--paper-50)}

/* ---------- Print (reports) ---------- */
.print-header{display:none}
@media print{
  .topbar,.bottomnav,.no-print,.fab{display:none!important}
  body{background:#fff}
  .print-header{
    display:flex!important;align-items:center;gap:12px;margin-bottom:16px;
    padding-bottom:12px;border-bottom:2px solid var(--green-800);
  }
  .print-header img{width:46px;height:46px;border-radius:50%}
  .print-header h2{font-size:16px;color:var(--green-900)}
  .print-header p{font-size:11px;color:var(--ink-500);margin-top:2px}
  .section{break-inside:avoid;box-shadow:none;border:1px solid var(--line-strong)}
  .list-item{break-inside:avoid}
  .nl-sheet{box-shadow:none;border:1px solid var(--line-strong)}
  .nl-section{break-inside:avoid}
  .nl-header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .nl-period-badge{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

function $(sel,root){return (root||document).querySelector(sel)}
function $all(sel,root){return Array.from((root||document).querySelectorAll(sel))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function todayISO(){const d=new Date();return d.toISOString().slice(0,10)}
function nowTimeHM(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function fmtDate(iso){
  if(!iso) return '—';
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtDateShort(iso){
  if(!iso) return '—';
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function lastLoginLabel(e){
  if(!e.lastLoginAt||!e.lastLoginAt.toDate) return 'لم يسجّل الدخول بعد';
  const d=e.lastLoginAt.toDate();
  const iso=d.toISOString().slice(0,10);
  const daysAgo=Math.floor((Date.now()-d.getTime())/86400000);
  if(daysAgo<=0) return 'آخر دخول: اليوم';
  if(daysAgo===1) return 'آخر دخول: أمس';
  if(daysAgo<30) return `آخر دخول: قبل ${daysAgo} يوم`;
  return `آخر دخول: ${fmtDateShort(iso)}`;
}
function monthKey(iso){ if(!iso) return ''; return iso.slice(0,7); }
function monthLabel(key){
  if(!key) return '';
  const [y,m]=key.split('-');
  const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return `${months[parseInt(m,10)-1]} ${y}`;
}

/* تحقق موحّد من الحقول الإلزامية: يبرز الحقل الناقص بالأحمر برسالة تحت كل حقل، ويعيد أول عنصر للتمرير إليه (أو null إذا كل شي سليم) */
function validateRequiredFields(formEl){
  clearFieldErrors(formEl);
  let firstInvalid=null;
  $all('[data-required]',formEl).forEach(input=>{
    const val=(input.value||'').trim();
    if(!val){
      input.classList.add('field-invalid');
      const msg=document.createElement('div');
      msg.className='field-error-msg';
      msg.innerHTML=icon('alert')+`<span>الرجاء تعبئة "${esc(input.dataset.required)}"</span>`;
      input.insertAdjacentElement('afterend', msg);
      if(!firstInvalid) firstInvalid=input;
    }
  });
  return firstInvalid;
}
function clearFieldErrors(formEl){
  $all('.field-invalid',formEl).forEach(el=>el.classList.remove('field-invalid'));
  $all('.field-error-msg',formEl).forEach(el=>el.remove());
}

function setLoading(btn,loading,label){
  if(!btn) return;
  if(loading){btn.dataset.label=btn.innerHTML;btn.innerHTML='<span class="spinner" style="width:16px;height:16px;border-width:2px;margin:0"></span>';btn.disabled=true;}
  else{btn.innerHTML=btn.dataset.label||label||btn.innerHTML;btn.disabled=false;}
}
function enableDragScroll(sel){
  const el=$(sel);
  if(!el||el.dataset.dragBound) return;
  el.dataset.dragBound='1';
  let isDown=false, startX=0, startScroll=0, moved=false;
  el.addEventListener('mousedown',(e)=>{
    isDown=true; moved=false; el.classList.add('dragging');
    startX=e.pageX; startScroll=el.scrollLeft;
  });
  window.addEventListener('mouseup',()=>{ isDown=false; el.classList.remove('dragging'); });
  el.addEventListener('mouseleave',()=>{ isDown=false; el.classList.remove('dragging'); });
  el.addEventListener('mousemove',(e)=>{
    if(!isDown) return;
    e.preventDefault();
    const dx=e.pageX-startX;
    if(Math.abs(dx)>3) moved=true;
    el.scrollLeft=startScroll-dx;
  });
  el.addEventListener('click',(e)=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } },true);
}
function authErrorMessage(err){
  const code=err&&err.code||'';
  const known={
    'auth/user-not-found':'لا يوجد حساب بهذا الرقم الوظيفي',
    'auth/wrong-password':'الرقم السري غير صحيح',
    'auth/invalid-credential':'الرقم الوظيفي أو الرقم السري غير صحيح',
    'auth/invalid-email':'صيغة الرقم الوظيفي غير صالحة',
    'auth/user-disabled':'هذا الحساب معطّل من إعدادات Firebase',
    'auth/too-many-requests':'محاولات كثيرة متتالية، الرجاء الانتظار قليلاً ثم إعادة المحاولة',
    'auth/network-request-failed':'تعذر الاتصال بالخادم — الرجاء التحقق من الشبكة أو برنامج الحماية (مثل Kaspersky)',
  };
  const base=known[code]||'تعذر تسجيل الدخول';
  return code?`${base} (${code})`:base;
}

/* ---------------- الاشتراك في البيانات الحية (Firestore) ---------------- */
let unsubs=[];
function clearSubs(){ unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[]; }
function subscribeAll(){
  clearSubs();
  unsubs.push(onSnapshot(query(collection(db,'employees'),orderBy('name')),snap=>{
    S.employees=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  },err=>console.error('employees sub',err)));
  unsubs.push(onSnapshot(query(collection(db,'requests'),orderBy('createdAt','desc')),snap=>{
    S.requests=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  },err=>console.error('requests sub',err)));
  unsubs.push(onSnapshot(query(collection(db,'visits'),orderBy('date','desc')),snap=>{
    S.visits=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  },err=>console.error('visits sub',err)));
  unsubs.push(onSnapshot(query(collection(db,'meetings'),orderBy('date','desc')),snap=>{
    S.meetings=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  },err=>console.error('meetings sub',err)));
  unsubs.push(onSnapshot(query(collection(db,'tasks'),orderBy('startDate','desc')),snap=>{
    S.tasks=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  },err=>console.error('tasks sub',err)));
  unsubs.push(onSnapshot(query(collection(db,'notifications'),where('toEmployeeId','==',S.user.id)),snap=>{
    S.notifications=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{
      const at=a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0;
      const bt=b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0;
      return bt-at;
    });
    render();
  },err=>console.error('notifications sub',err)));
  unsubs.push(onSnapshot(collection(db,'newsletters'),snap=>{
    S.newsletters=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.period||'').localeCompare(a.period||''));
    render();
  },err=>console.error('newsletters sub',err)));
}

/* ---------------- حالة تسجيل الدخول ---------------- */
onAuthStateChanged(auth, async (fbUser)=>{
  S.fbUser=fbUser;
  if(fbUser){
    try{
      const snap=await getDoc(doc(db,'employees',fbUser.uid));
      if(snap.exists() && snap.data().active!==false){
        S.user={id:fbUser.uid,...snap.data()};
        subscribeAll();
        S.ready=true;
        updateDoc(doc(db,'employees',fbUser.uid),{lastLoginAt:serverTimestamp()}).catch(err=>console.error('lastLogin',err));
        if(S.route==='landing'||S.route==='login'){ go('portal-dashboard'); return; }
        render(); return;
      } else if(snap.exists()){
        /* حساب موظف تم تعطيله من قبل المشرف */
        S.user=null;
        await signOut(auth);
        S.pendingLoginError='هذا الحساب معطّل، الرجاء التواصل مع المشرف';
        S.ready=true; go('login'); return;
      } else {
        /* حساب مصادقة بلا ملف موظف مرتبط - حالة استثنائية */
        console.error('لا يوجد مستند Firestore يطابق UID:', fbUser.uid, '— يجب أن يطابق معرّف المستند بمجموعة employees هذا الـ UID تماماً');
        S.user=null;
        await signOut(auth);
        S.pendingLoginError='لا يوجد ملف موظف مرتبط بهذا الحساب، الرجاء التواصل مع المشرف';
        S.ready=true; go('login'); return;
      }
    }catch(e){
      console.error('خطأ أثناء جلب ملف الموظف:', e.code||e.message||e);
      S.user=null;
      try{ await signOut(auth); }catch(e2){}
      S.pendingLoginError='تعذر التحقق من صلاحيات الحساب — على الأغلب قواعد أمان Firestore غير محفوظة بعد ('+(e.code||e.message||'خطأ غير معروف')+')';
      S.ready=true; go('login'); return;
    }
  } else {
    S.user=null; clearSubs();
    S.employees=[];S.requests=[];S.visits=[];S.meetings=[];
    S.ready=true;
    if(S.route.startsWith('portal')){ go('landing'); return; }
    render();
  }
});

function resizeImageFileToDataURL(file, size){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('read-failed'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('image-decode-failed'));
      img.onload=()=>{
        const side=Math.min(img.width,img.height);
        const sx=(img.width-side)/2, sy=(img.height-side)/2;
        const canvas=document.createElement('canvas');
        canvas.width=size; canvas.height=size;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------- الموزّع الرئيسي render ---------------- */
function render(){
  const app=$('#app');
  if(!S.ready){ app.innerHTML='<div class="loading-screen"><div class="spinner"></div></div>'; return; }

  if(S.route==='landing') { app.innerHTML=renderLanding(); wireLanding(); return; }
  if(S.route==='request-form'){ app.innerHTML=renderPublicRequestForm(); wirePublicRequestForm(); return; }
  if(S.route==='login'){ app.innerHTML=renderLanding(true); wireLanding(); return; }

  /* المسارات التالية تتطلب تسجيل دخول */
  if(!S.user){ go('landing'); return; }

  let inner='';
  if(S.route==='portal-dashboard') inner=renderDashboard();
  else if(S.route==='portal-requests') inner=renderRequestsList();
  else if(S.route==='portal-request-add') inner=renderRequestAddInternal();
  else if(S.route==='portal-request-detail') inner=renderRequestDetail(S.routeParam);
  else if(S.route==='portal-visits') inner=renderVisitsList();

  else if(S.route==='portal-employees') inner=renderEmployees();
  else if(S.route==='portal-reports') inner=renderReports();

  app.innerHTML=portalShell(inner);

function wireShellEvents(){
  $all('.topbar [data-go], .bottomnav [data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
  const av=$('#avatarBtn');
  if(av) av.addEventListener('click',(e)=>{e.stopPropagation();S.menuOpen=!S.menuOpen;S.notifMenuOpen=false;render();});
  const nb=$('#notifBellBtn');
  if(nb) nb.addEventListener('click',(e)=>{e.stopPropagation();S.notifMenuOpen=!S.notifMenuOpen;S.menuOpen=false;render();});
  document.addEventListener('click',(e)=>{
    if(S.menuOpen && !e.target.closest('.topbar-user')){S.menuOpen=false;render();}
    if(S.notifMenuOpen && !e.target.closest('.topbar-user')){S.notifMenuOpen=false;render();}
  },{once:true});
  const markAllBtn=$('#markAllReadBtn');
  if(markAllBtn) markAllBtn.addEventListener('click',async(e)=>{
    e.stopPropagation();
    const unread=S.notifications.filter(n=>!n.read);
    try{ await Promise.all(unread.map(n=>updateDoc(doc(db,'notifications',n.id),{read:true}))); }
    catch(err){ console.error(err); }
  });
  $all('[data-notif]').forEach(b=>b.addEventListener('click',async(e)=>{
    e.stopPropagation();
    const nid=b.dataset.notif, route=b.dataset.notifRoute, param=b.dataset.notifParam;
    try{ await updateDoc(doc(db,'notifications',nid),{read:true}); }catch(err){ console.error(err); }
    S.notifMenuOpen=false;
    if(route) go(route, param||null); else render();
  }));
  const lo=$('#logoutBtn');
  if(lo) lo.addEventListener('click',async()=>{ await signOut(auth); toast('تم تسجيل الخروج'); });
  const bk=$('#backupBtn');
  if(bk) bk.addEventListener('click',runBackupExport);
  const imp=$('#importBtn');
  if(imp) imp.addEventListener('click',openImportModal);
}

function wireRequestFormCommon(onSuccess){
  $all('[data-required]').forEach(input=>{
    input.addEventListener('input',()=>{
      if(input.classList.contains('field-invalid')){
        input.classList.remove('field-invalid');
        const next=input.nextElementSibling;
        if(next&&next.classList.contains('field-error-msg')) next.remove();
      }
    });
  });
  $all('[data-tile] input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change',()=>{
      cb.closest('[data-tile]').classList.toggle('on',cb.checked);
      const toggleId=cb.dataset.otherToggle;
      if(toggleId) $('#'+toggleId).style.display=cb.checked?'block':'none';
    });
  });
  $all('[data-priority]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      $all('[data-priority]').forEach(b=>b.className='radio-pill');
      btn.classList.add('on',btn.dataset.priority);
      $('input[name=priority]').value=btn.dataset.priority;
    });
  });
  const f=$('#reqForm');
  f.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const errEl=$('#reqFormErr'); errEl.style.display='none';
    const firstInvalid=validateRequiredFields(f);
    if(firstInvalid){
      firstInvalid.scrollIntoView({behavior:'smooth',block:'center'});
      firstInvalid.focus();
      toast('الرجاء تعبئة كل الحقول المطلوبة (موضّحة بالأحمر)',true);
      return;
    }
    const fd=new FormData(f);
    const btn=$('#reqSubmitBtn');
    setLoading(btn,true);
    try{
      const requestNumber = await nextRequestNumber();
      const data={
        requestNumber,
        requester:{
          directorate:fd.get('directorate')||'', transferNumber:fd.get('transferNumber')||'',
          employeeNumber:fd.get('employeeNumber')||'', employeeName:fd.get('employeeName')||''
        },
        event:{
          name:fd.get('eventName')||'', description:fd.get('eventDesc')||'',
          date:fd.get('eventDate')||'', startTime:fd.get('startTime')||'', endTime:fd.get('endTime')||'',
          location:fd.get('location')||''
        },
        serviceTypes:{
          photo:fd.has('svc_photo'), video:fd.has('svc_video'), drone:fd.has('svc_drone'),
          podcast:fd.has('svc_podcast'), timelapse:fd.has('svc_timelapse'),
          other:fd.has('svc_other'), otherLabel:fd.get('svcOtherLabel')||''
        },
        outputs:{
          mediaPublish:fd.has('out_mediaPublish'), documentation:fd.has('out_documentation'),
          shortVideo:fd.has('out_shortVideo'), fullVideo:fd.has('out_fullVideo'),
          hqPhotos:fd.has('out_hqPhotos'), reels:fd.has('out_reels'), digitalFile:fd.has('out_digitalFile'),
          other:fd.has('out_other'), otherLabel:fd.get('outOtherLabel')||''
        },
        extra:{
          importantPeople:fd.get('importantPeople')||'', focusShots:fd.get('focusShots')||'',
          notes:fd.get('extraNotes')||''
        },
        priority:fd.get('priority')||'medium',
        managerApproval:{ name:fd.get('managerName')||'', date:fd.get('managerDate')||'' },
        internal:{ receivedDate:'', teamNotes:'', assignedPhotographers:[], assignedEditors:[], leadApprovalName:'', leadApprovalDate:'' },
        beneficiary:{ name:'', date:'', notes:'' },
        status:'submitted',
        createdAt: serverTimestamp(), updatedAt: serverTimestamp()
      };
      if(S.user) data.createdBy=S.user.name;
      const newRef=await addDoc(collection(db,'requests'), data);
      onSuccess(requestNumber, newRef.id);
    }catch(err){
      console.error(err);
      setLoading(btn,false,'<span>'+icon('send')+' إرسال الطلب</span>');
      errEl.textContent='تعذر إرسال الطلب، الرجاء المحاولة مرة أخرى'; errEl.style.display='block';
    }
  });
}

async function nextRequestNumber(){
  const year=new Date().getFullYear();
  const counterRef=doc(db,'counters','requests-'+year);
  const num = await runTransaction(db, async(tx)=>{
    const snap=await tx.get(counterRef);
    const next=(snap.exists()?snap.data().count:0)+1;
    tx.set(counterRef,{count:next},{merge:true});
    return next;
  });
  return `REQ-${year}-${String(num).padStart(4,'0')}`;
}

function wireRequestDetail(id){

  const r=S.requests.find(x=>x.id===id);
  if(!r) return;
  const delBtn=$('#deleteReqBtn');
  if(delBtn) delBtn.addEventListener('click',async()=>{
    if(!confirm(`نقل الطلب "${r.event&&r.event.name||''}" إلى سلة المحذوفات؟ يمكن استعادته لاحقاً.`)) return;
    try{
      await updateDoc(doc(db,'requests',id),{deleted:true, deletedAt:serverTimestamp(), deletedBy:S.user.name});
      toast('تم نقل الطلب إلى سلة المحذوفات');
      go('portal-requests');
    }catch(err){ console.error(err); toast('تعذر الحذف',true); }
  });
  const resBtn=$('#restoreReqBtn');
  if(resBtn) resBtn.addEventListener('click',async()=>{
    try{
      await updateDoc(doc(db,'requests',id),{deleted:false, deletedAt:null, deletedBy:null});
      toast('تمت استعادة الطلب');
    }catch(err){ console.error(err); toast('تعذر الاستعادة',true); }
  });
  $all('#internalForm [data-tile] input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change',()=>cb.closest('[data-tile]').classList.toggle('on',cb.checked));
  });
  const srtBtn=$('#setReceivedTodayBtn');
  if(srtBtn) srtBtn.addEventListener('click',()=>{ $('#internalForm [name=receivedDate]').value=todayISO(); });

  $all('[data-remove-attach]').forEach(b=>b.addEventListener('click',async()=>{
    const idx=parseInt(b.dataset.removeAttach,10);

  }));
  const attForm=$('#attachForm');
  if(attForm) attForm.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const btn=e.target.querySelector('[type=submit]');
    const fd=new FormData(attForm);
    const next=[...(r.attachments||[]), {label:fd.get('label')||'', url:fd.get('url')||'', addedBy:S.user.name, addedAt:todayISO()}];
    setLoading(btn,true);
    try{
      await updateDoc(doc(db,'requests',id),{attachments:next, updatedAt:serverTimestamp()});
      toast('تمت إضافة المرفق');
    }catch(err){
      console.error(err);
      toast('تعذر إضافة المرفق',true);
    }
    setLoading(btn,false,'<span>'+icon('plus')+' إضافة مرفق</span>');
  });

  const iform=$('#internalForm');
  if(iform) iform.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const btn=e.target.querySelector('[type=submit]');
    const fd=new FormData(iform);
    const photographers=S.employees.filter(emp=>fd.has('photog_'+emp.id)).map(emp=>emp.id);
    const editors=S.employees.filter(emp=>fd.has('editor_'+emp.id)).map(emp=>emp.id);
    const receivedDate=fd.get('receivedDate')||'';
    let newStatus=r.status;
    if(receivedDate && newStatus==='submitted') newStatus='received';
    if((photographers.length||editors.length) && (newStatus==='received'||newStatus==='submitted')) newStatus='assigned';
    setLoading(btn,true);
    try{
      await updateDoc(doc(db,'requests',id),{
        'internal.receivedDate':receivedDate,
        'internal.teamNotes':fd.get('teamNotes')||'',
        'internal.assignedPhotographers':photographers,
        'internal.assignedEditors':editors,
        status:newStatus,
        updatedAt:serverTimestamp()
      });
      toast('تم الحفظ بنجاح');
      setLoading(btn,false,'<span>'+icon('check')+' حفظ</span>');
    }catch(err){ console.error(err); setLoading(btn,false,'<span>'+icon('check')+' حفظ</span>'); toast('تعذر الحفظ',true); }
  });

  const leadBtn=$('#leadApproveBtn');
  if(leadBtn) leadBtn.addEventListener('click',async()=>{
    setLoading(leadBtn,true);
    try{
      await updateDoc(doc(db,'requests',id),{
        'internal.leadApprovalName':S.user.name,
        'internal.leadApprovalDate':todayISO(),
        status:'completed',
        updatedAt:serverTimestamp()
      });
      toast('تم اعتماد الطلب وإنهاؤه');
    }catch(err){ console.error(err); setLoading(leadBtn,false,'<span>'+icon('award')+' اعتماد وإنهاء الطلب</span>'); toast('تعذر الاعتماد',true); }
  });

  const bform=$('#beneficiaryForm');
  if(bform) bform.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const btn=e.target.querySelector('[type=submit]');
    const fd=new FormData(bform);
    setLoading(btn,true);
    try{
      await updateDoc(doc(db,'requests',id),{
        'beneficiary.name':fd.get('benName')||'',
        'beneficiary.date':fd.get('benDate')||'',
        'beneficiary.notes':fd.get('benNotes')||'',
        updatedAt:serverTimestamp()
      });
      toast('تم حفظ توقيع المستفيد');
      setLoading(btn,false,'<span>'+icon('check')+' حفظ توقيع المستفيد</span>');
    }catch(err){ console.error(err); setLoading(btn,false,'<span>'+icon('check')+' حفظ توقيع المستفيد</span>'); toast('تعذر الحفظ',true); }
  });

const TASK_TYPES=['تصوير مراحل المشروع','تقييم','تصوير المبنى','برنامج أثر','تصوير','مسابقة'];
function visitsMonthOptions(){
  const set=new Set(S.visits.map(v=>monthKey(v.date)));
  set.add(todayISO().slice(0,7));
  return Array.from(set).sort().reverse();
}
function visitsListInnerHtml(list){
  if(list.length===0) return `<div class="section"><div class="empty-state">${icon('pin')}<h3>لا توجد زيارات مسجّلة</h3><p>لم تُسجَّل أي زيارة هنا بعد</p></div></div>`;
  return `<div class="card-grid">${list.map(v=>{
    const sites=v.sites||[];
    const typesPreview=[...new Set(sites.map(s=>s.taskType).filter(Boolean))].slice(0,2).join('، ');
    return `
    <div class="grid-card" data-visit="${v.id}">
      <div class="grid-card-top">
        <span class="badge badge-role-member">${sites.length} ${sites.length===1?'موقع':'مواقع'}</span>
        ${!v.date?`<span class="badge badge-urgent">بدون تاريخ</span>`:''}
        ${v.certified===false?`<span class="badge badge-urgent">بانتظار الاعتماد</span>`:''}
      </div>
      <div class="grid-card-title">${v.date?fmtDate(v.date):'بدون تاريخ'}</div>
      <div class="grid-card-sub">${esc(typesPreview||(sites[0]&&sites[0].projectName)||'')}</div>
      ${(v.conductedBy&&v.conductedBy.length)?`<div class="grid-card-sub" style="margin-top:3px">${esc(v.conductedBy.join('، '))}</div>`:''}
    </div>`;
  }).join('')}</div>`;
}
function renderVisitsList(){
  const months=visitsMonthOptions();
  const hasUndated=S.visits.some(v=>!v.date);
  const active=S.filters.visitsMonth&&(months.includes(S.filters.visitsMonth)||S.filters.visitsMonth==='undated')?S.filters.visitsMonth:months[0];
  S.filters.visitsMonth=active;
  const list=active==='undated'
    ? S.visits.filter(v=>!v.date)
    : S.visits.filter(v=>monthKey(v.date)===active).sort((a,b)=>b.date.localeCompare(a.date));
  return `
  <div class="section-title-row"><h2>الزيارات</h2>
    <button class="btn btn-primary btn-sm" data-go="portal-visit-add">${icon('plus')} إضافة زيارة</button>
  </div>
  <div class="chiprow" id="visitsChiprow">
    ${months.map(m=>`<button class="chip ${active===m?'on':''}" data-month="${m}">${monthLabel(m)}</button>`).join('')}
    ${hasUndated?`<button class="chip ${active==='undated'?'on':''}" data-month="undated" style="border-color:var(--red-600);${active==='undated'?'background:var(--red-600);border-color:var(--red-600)':'color:var(--red-600)'}">بدون تاريخ</button>`:''}
  </div>
  <div id="visitsListWrap">${visitsListInnerHtml(list)}</div>
  `;
}
function wireVisitsList(){
  $all('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
  $all('[data-month]').forEach(b=>b.addEventListener('click',()=>{S.filters.visitsMonth=b.dataset.month; render();}));
  $all('[data-visit]').forEach(el=>el.addEventListener('click',()=>go('portal-visit-detail',el.dataset.visit)));
  enableDragScroll('#visitsChiprow');
}

    <span class="site-num">موقع ${idx+1}</span>
    ${idx>0?`<button type="button" class="site-remove" data-remove-site="${idx}">${icon('x')}</button>`:''}

      <label>نوع المهمة</label>
      <select class="input" name="taskType_${idx}">
        ${TASK_TYPES.map(t=>`<option value="${esc(t)}" ${data.taskType===t?'selected':''}>${esc(t)}</option>`).join('')}
        <option value="__other__" ${isOther?'selected':''}>أخرى...</option>
      </select>
    </div>
    <div class="field" style="display:${isOther?'block':'none'}" data-other-wrap="${idx}">
      <label>حدد نوع المهمة</label>

    </div>

function wireSiteRow(idx){
  const row=$(`[data-site-row="${idx}"]`);
  const sel=row.querySelector(`[name=taskType_${idx}]`);
  const otherWrap=$(`[data-other-wrap="${idx}"]`);
  sel.addEventListener('change',()=>{ otherWrap.style.display = sel.value==='__other__'?'block':'none'; });
  const rm=row.querySelector('[data-remove-site]');
  if(rm) rm.addEventListener('click',()=>row.remove());
}
function wireVisitAdd(){
  $all('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
  visitSiteRows=1;
  wireSiteRow(0);
  $all('[data-tile] input[type=checkbox]').forEach(cb=>cb.addEventListener('change',()=>cb.closest('[data-tile]').classList.toggle('on',cb.checked)));
  $('#addSiteBtn').addEventListener('click',()=>{
    $('#siteRowsWrap').insertAdjacentHTML('beforeend', siteRowHtml(visitSiteRows));
    wireSiteRow(visitSiteRows);
    visitSiteRows++;
  });
  $('#visitForm').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const btn=$('#visitForm button[type=submit]');
    const fd=new FormData(e.target);
    const rows=$all('[data-site-row]');
    const sites=rows.map(row=>{
      const idx=row.dataset.siteRow;
      let taskType=fd.get('taskType_'+idx);
      if(taskType==='__other__') taskType=fd.get('taskTypeOther_'+idx)||'أخرى';
      return {
        taskType,
        projectName:fd.get('projectName_'+idx)||'',
        location:fd.get('location_'+idx)||'',
        description:fd.get('description_'+idx)||''
      };
    });
    const conductedBy=collectCheckedEmployeeNames(fd,'cond');
    const visitDate=fd.get('visitDate');
    const assignTo=fd.get('assignTo')||'';
    setLoading(btn,true);
    try{
      const newVisitRef=await addDoc(collection(db,'visits'),{
        date:visitDate, sites, conductedBy, certified:S.user.role==='lead', createdBy:S.user.name, createdAt:serverTimestamp()
      });
      if(assignTo){
        const emp=S.employees.find(x=>x.id===assignTo);
        await createNotification(assignTo, `تم إسناد مهمة زيارة لك بتاريخ ${fmtDateShort(visitDate)}، يجب الاطلاع عليها من خلال المنصة`, 'portal-visit-detail', newVisitRef.id);
        S.filters.visitsMonth=monthKey(visitDate);
        showAssignmentSentOverlay(emp, visitDate, sites);
        return;
      }
      toast(S.user.role==='lead'?'تم حفظ الزيارة بنجاح':'تم حفظ الزيارة، بانتظار اعتماد المشرف');
      S.filters.visitsMonth=monthKey(visitDate);
      go('portal-visits');
    }catch(err){
      console.error(err);
      setLoading(btn,false,'<span>'+icon('check')+' حفظ الزيارة</span>');
      toast('تعذر حفظ الزيارة',true);
    }
  });
}
function buildAssignmentMailto(emp, visitDate, sites){
  const to=`${emp.employeeNumber}@mm.gov.om`;
  const sitesText=(sites||[]).map(s=>`- ${s.projectName||''} (${s.taskType||''}) — ${s.location||''}`).join(String.fromCharCode(10));
  const subject='تم إسناد مهمة لك - منصة فريق التصوير';
  const body=`عزيزي/عزيزتي ${emp.name}،

تم إسناد مهمة زيارة لك بتاريخ ${fmtDateShort(visitDate)}.

${sitesText}

الرجاء الاطلاع على التفاصيل الكاملة والتأكيد من خلال منصة فريق التصوير.

شكراً لك`;
  return `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

/* ============================================================
   استيراد من ملف Excel (جدول الزيارات أو جدول الأعمال)
   يفتح منتقي الملفات الأصلي لنظام التشغيل (سطح المكتب أو أي مجلد)
   ============================================================ */
let XLSXLib=null, pendingImportData=null, importFileType='visits';
async function ensureXLSXLoaded(){
  if(XLSXLib) return XLSXLib;
  XLSXLib = await import('https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs');
  return XLSXLib;
}
function cellToISODate(cell){
  if(cell==null) return null;
  let y,m,d;
  if(cell instanceof Date){
    y=cell.getUTCFullYear(); m=cell.getUTCMonth()+1; d=cell.getUTCDate();
  } else {
    const s=String(cell).trim();
    const match=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(!match) return null;
    d=parseInt(match[1],10); m=parseInt(match[2],10); y=parseInt(match[3],10);
  }
  if(!y||y<2015||y>2100) return null;
  /* بعض ملفاتها تحتوي خلايا تواريخ مُدخلة بترتيب يوم/شهر معكوس (خلل إدخال قديم بالمصدر) —
     نتحقق: لو التاريخ الناتج بعيد بشكل غير منطقي عن الوقت الحالي، ولو تبديل اليوم بالشهر
     ينتج تاريخاً أقرب للمنطق، نعتمد التبديل. ولو ما زال بعيداً حتى بعد المحاولة، نتركه فارغاً
     بدل تخمين تاريخ خاطئ — يبقى قابلاً للتصحيح يدوياً من صفحة تفاصيل الزيارة/المهمة. */
  const now=new Date();
  const nowMonths=now.getUTCFullYear()*12+now.getUTCMonth();
  const monthsAway=(mo)=>Math.abs((y*12+(mo-1))-nowMonths);
  let finalM=m, finalD=d, diff=monthsAway(m);
  if(diff>14 && d>=1 && d<=12 && d!==m){
    const swapDiff=monthsAway(d);
    if(swapDiff<diff){ finalM=d; finalD=m; diff=swapDiff; }
  }
  if(diff>14) return null;
  return `${y}-${String(finalM).padStart(2,'0')}-${String(finalD).padStart(2,'0')}`;
}
function parseVisitsRows(rows){
  const visits=[]; let current=null;
  for(let i=1;i<rows.length;i++){
    const row=rows[i]||[];
    const desc=row[0], taskType=row[1], project=row[2], location=row[3], dateRaw=row[4], batchNum=row[5];
    if(batchNum==null && desc==null && taskType==null && project==null && location==null && dateRaw==null) continue;
    if(dateRaw!=null || batchNum!=null){
      const iso=cellToISODate(dateRaw);
      current={date:iso||'', sites:[]};
      visits.push(current);
    }
    if(!current) continue;
    if(project==null && taskType==null && desc==null) continue;
    current.sites.push({
      taskType:(taskType||'أخرى').toString().trim(),
      projectName:(project||'').toString().trim(),
      location:(location||'').toString().trim(),
      description:(desc||'').toString().trim()
    });
  }
  return visits.filter(v=>v.sites.length);
}
function parseTasksRows(rows){
  const tasks=[];
  for(let i=2;i<rows.length;i++){
    const row=rows[i]||[];
    const notes=row[1], status=row[2], responsible=row[3], endRaw=row[4], startRaw=row[5], title=row[6];
    if(title==null || !String(title).trim()) continue;
    let respList=[];
    if(responsible){
      let raw=String(responsible).replace(/\([^)]*\)/g,'').trim().replace(/ و /g,' - ');
      respList=raw.split(' - ').map(s=>s.trim()).filter(Boolean);
    }
    tasks.push({
      title:String(title).trim(),
      startDate:cellToISODate(startRaw)||'',
      endDate:cellToISODate(endRaw)||'',
      responsible:respList,
      status:(status||'').toString().trim(),
      notes:(notes||'').toString().trim()
    });
  }
  return tasks;
}

function wireImportModal(){
  const ov=$('#importOverlay');
  $('#closeImport').addEventListener('click',()=>{ov.remove(); pendingImportData=null;});
  ov.addEventListener('click',(e)=>{ if(e.target===ov){ ov.remove(); pendingImportData=null; } });
  $all('[data-itype]').forEach(b=>b.addEventListener('click',()=>{
    $all('[data-itype]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    importFileType=b.dataset.itype;
    pendingImportData=null;
    $('#importPreview').innerHTML='';
    $('#importConfirmBtn').disabled=true;
    $('#importFileInput').value='';
  }));
  $('#importFileInput').addEventListener('change',async(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    const preview=$('#importPreview');
    preview.innerHTML='<div class="spinner" style="margin:14px auto"></div>';
    $('#importConfirmBtn').disabled=true;
    try{
      const XLSX=await ensureXLSXLoaded();
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array', cellDates:true});
      if(importFileType==='visits'){
        let all=[];
        wb.SheetNames.forEach(name=>{
          const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1, defval:null});
          all=all.concat(parseVisitsRows(rows));
        });
        pendingImportData={type:'visits', data:all};
        const totalSites=all.reduce((s,v)=>s+v.sites.length,0);
        preview.innerHTML=all.length?
          `<div class="field" style="background:var(--green-50);border-radius:8px;padding:12px;margin-bottom:0"><strong>${all.length}</strong> زيارة بإجمالي <strong>${totalSites}</strong> موقع جاهزة للاستيراد</div>`:
          `<div class="err-text">لم يتم العثور على بيانات زيارات صالحة بهذا الملف</div>`;
      } else {
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1, defval:null});
        const tasks=parseTasksRows(rows);
        pendingImportData={type:'tasks', data:tasks};
        preview.innerHTML=tasks.length?
          `<div class="field" style="background:var(--green-50);border-radius:8px;padding:12px;margin-bottom:0"><strong>${tasks.length}</strong> مهمة جاهزة للاستيراد</div>`:
          `<div class="err-text">لم يتم العثور على بيانات مهام صالحة بهذا الملف</div>`;
      }
      $('#importConfirmBtn').disabled=!(pendingImportData.data.length);
    }catch(err){
      console.error(err);
      preview.innerHTML=`<div class="err-text">تعذر قراءة الملف، تأكد من أنه بصيغة xlsx وبنفس أعمدة القالب المعتمد</div>`;
    }
  });
  $('#importConfirmBtn').addEventListener('click',async()=>{
    if(!pendingImportData||!pendingImportData.data.length) return;
    const btn=$('#importConfirmBtn');
    setLoading(btn,true);
    try{
      if(pendingImportData.type==='visits'){
        for(const v of pendingImportData.data){
          await addDoc(collection(db,'visits'),{date:v.date, sites:v.sites, certified:true, createdBy:S.user.name, createdAt:serverTimestamp()});
        }
      } else {
        const statusMap={'تم الانتهاء':'completed','جاري العمل':'in_progress'};
        for(const t of pendingImportData.data){
          await addDoc(collection(db,'tasks'),{
            title:t.title, startDate:t.startDate, endDate:t.endDate, responsible:t.responsible,
            status:statusMap[t.status]||'not_started', notes:t.notes, certified:true,
            createdBy:S.user.name, createdAt:serverTimestamp()
          });
        }
      }
      toast('تم الاستيراد بنجاح');
      const w=$('#importOverlay'); if(w) w.remove();
      pendingImportData=null;
    }catch(err){
      console.error(err);
      setLoading(btn,false,'<span>'+icon('check')+' استيراد</span>');
      toast('تعذر إتمام الاستيراد، تأكد من قواعد الأمان (Rules)',true);
    }
  });
}

    const cred=await createUserWithEmailAndPassword(secondaryAuth, emp.employeeNumber+AUTH_DOMAIN_SUFFIX, DEFAULT_EMP_PASSWORD);

    await setDoc(doc(db,'employees',newUid),{

    });
    await signOut(secondaryAuth);

    const w=$('#editEmpOverlay'); if(w) w.remove();
  }catch(err){
    console.error(err);

    toast(msg,true);

  }

   التقارير والأداء (مشرف فقط) + نسخة احتياطية
   ============================================================ */
function computeReportStats(start,end){
  const reqInPeriod=S.requests.filter(r=>!r.deleted&&r.event&&r.event.date&&r.event.date>=start&&r.event.date<=end);
  const visitsInPeriod=S.visits.filter(v=>v.certified!==false&&v.date&&v.date>=start&&v.date<=end);
  const meetingsInPeriod=S.meetings.filter(m=>m.date&&m.date>=start&&m.date<=end);
  const reqByStatus={submitted:0,received:0,assigned:0,completed:0};
  const reqByPriority={urgent:0,medium:0,prescheduled:0};
  reqInPeriod.forEach(r=>{
    if(reqByStatus[r.status]!==undefined) reqByStatus[r.status]++;
    if(reqByPriority[r.priority]!==undefined) reqByPriority[r.priority]++;
  });
  let totalSiteVisits=0; const byTaskType={};
  visitsInPeriod.forEach(v=>(v.sites||[]).forEach(s=>{
    totalSiteVisits++;
    byTaskType[s.taskType]=(byTaskType[s.taskType]||0)+1;
  }));
  const perEmp=S.employees.map(e=>{
    const asPhotog=reqInPeriod.filter(r=>r.internal&&r.internal.assignedPhotographers&&r.internal.assignedPhotographers.includes(e.id)).length;
    const asEditor=reqInPeriod.filter(r=>r.internal&&r.internal.assignedEditors&&r.internal.assignedEditors.includes(e.id)).length;
    const visitsLogged=visitsInPeriod.filter(v=>v.createdBy===e.name || (v.conductedBy&&v.conductedBy.includes(e.name))).length;
    const meetingsAttended=meetingsInPeriod.filter(m=>m.attendees&&m.attendees.includes(e.id)).length;
    return {emp:e,asPhotog,asEditor,visitsLogged,meetingsAttended,total:asPhotog+asEditor+visitsLogged+meetingsAttended};
  }).sort((a,b)=>b.total-a.total);
  return {reqTotal:reqInPeriod.length,reqByStatus,reqByPriority,visitDays:visitsInPeriod.length,totalSiteVisits,byTaskType,meetingsTotal:meetingsInPeriod.length,perEmp};
}
function computeEmployeeDetail(empId,empName,start,end){
  const reqAsPhotog=S.requests.filter(r=>!r.deleted&&r.internal&&r.internal.assignedPhotographers&&r.internal.assignedPhotographers.includes(empId)&&r.event&&r.event.date>=start&&r.event.date<=end);
  const reqAsEditor=S.requests.filter(r=>!r.deleted&&r.internal&&r.internal.assignedEditors&&r.internal.assignedEditors.includes(empId)&&r.event&&r.event.date>=start&&r.event.date<=end);
  const visitsConducted=S.visits.filter(v=>v.certified!==false&&((v.conductedBy&&v.conductedBy.includes(empName))||v.createdBy===empName)&&v.date&&v.date>=start&&v.date<=end);
  const meetingsAttended=S.meetings.filter(m=>m.attendees&&m.attendees.includes(empId)&&m.date>=start&&m.date<=end);
  const tasksResponsible=S.tasks.filter(t=>!t.deleted&&t.certified!==false&&t.responsible&&t.responsible.includes(empName)&&t.startDate&&t.startDate>=start&&t.startDate<=end);
  return {reqAsPhotog,reqAsEditor,visitsConducted,meetingsAttended,tasksResponsible};
}
function barChartHtml(rows){
  const max=Math.max(1, ...rows.map(r=>r.value));
  if(!rows.length) return `<p class="muted">لا توجد بيانات كافية</p>`;
  return `<div class="bar-chart">${rows.map(r=>`
    <div class="bar-row">
      <div class="bar-label" title="${esc(r.label)}">${esc(r.label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.value/max*100)}%;${r.color?'background:'+r.color:''}"></div></div>
      <div class="bar-value">${r.value}</div>
    </div>`).join('')}</div>`;
}
function yearOptions(){
  const cy=new Date().getFullYear(); const arr=[];
  for(let y=cy-2;y<=cy+1;y++) arr.push(y);
  return arr;
}
function currentQuarter(){ return Math.floor(new Date().getMonth()/3)+1; }
function reportPeriodBounds(type,value){
  if(type==='month'){
    const [y,m]=value.split('-').map(Number);
    const start=`${y}-${String(m).padStart(2,'0')}-01`;
    const lastDay=new Date(y,m,0).getDate();
    const end=`${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
    return {start,end,label:monthLabel(value)};
  }
  if(type==='quarter'){
    const [y,q]=value.split('-Q').map(Number);
    const startMonth=(q-1)*3+1, endMonth=startMonth+2;
    const start=`${y}-${String(startMonth).padStart(2,'0')}-01`;
    const lastDay=new Date(y,endMonth,0).getDate();
    const end=`${y}-${String(endMonth).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
    return {start,end,label:`الربع ${q} - ${y}`};
  }
  const y=parseInt(value,10);
  return {start:`${y}-01-01`,end:`${y}-12-31`,label:`سنة ${y}`};
}

async function exportReportToExcel(){
  const btn=$('#exportExcelBtn');
  setLoading(btn,true);
  try{
    const XLSX=await ensureXLSXLoaded();
    const period=reportPeriodBounds(S.filters.reportType, S.filters.reportValue);
    const wb=XLSX.utils.book_new();
    if(S.filters.reportSelectedEmpId){
      const emp=S.employees.find(e=>e.id===S.filters.reportSelectedEmpId);
      if(emp){
        const d=computeEmployeeDetail(emp.id, emp.name, period.start, period.end);
        const rows=[['النوع','العنوان','التاريخ','ملاحظة']];
        d.reqAsPhotog.forEach(r=>rows.push(['طلب (تصوير)', (r.event&&r.event.name)||'', (r.event&&r.event.date)||'', r.requestNumber||'']));
        d.reqAsEditor.forEach(r=>rows.push(['طلب (مونتاج)', (r.event&&r.event.name)||'', (r.event&&r.event.date)||'', r.requestNumber||'']));
        d.visitsConducted.forEach(v=>rows.push(['زيارة', (v.sites||[]).map(s=>s.projectName).join('، '), v.date||'', '']));
        d.meetingsAttended.forEach(m=>rows.push(['اجتماع', m.title||'', m.date||'', '']));
        d.tasksResponsible.forEach(t=>rows.push(['مهمة', t.title||'', t.startDate||'', taskStatusLabel(t.status)]));
        const ws=XLSX.utils.aoa_to_sheet(rows);
        XLSX.utils.book_append_sheet(wb, ws, (emp.name||'تقرير').slice(0,28));
        XLSX.writeFile(wb, `تقرير-${emp.name}-${period.label}.xlsx`);
      }
    } else {
      const stats=computeReportStats(period.start, period.end);
      const summaryRows=[
        ['التقرير', `تقرير فريق التصوير - ${period.label}`],
        ['إجمالي الطلبات', stats.reqTotal],
        ['طلبات عاجلة', stats.reqByPriority.urgent],
        ['أيام الزيارات', stats.visitDays],
        ['إجمالي المواقع', stats.totalSiteVisits],
        ['الاجتماعات', stats.meetingsTotal],
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'ملخص');
      const statusRows=[['الحالة','العدد']];
      ['submitted','received','assigned','completed'].forEach(s=>statusRows.push([statusLabel(s), stats.reqByStatus[s]]));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(statusRows), 'الطلبات حسب الحالة');
      const typeRows=[['نوع المهمة','العدد']];
      Object.entries(stats.byTaskType).forEach(([t,c])=>typeRows.push([t,c]));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(typeRows), 'الزيارات حسب النوع');
      const empRows=[['الموظف','طلبات (تصوير)','طلبات (مونتاج)','زيارات','اجتماعات','الإجمالي']];
      stats.perEmp.forEach(row=>empRows.push([row.emp.name, row.asPhotog, row.asEditor, row.visitsLogged, row.meetingsAttended, row.total]));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(empRows), 'أداء الموظفين');
      XLSX.writeFile(wb, `تقرير-فريق-التصوير-${period.label}.xlsx`);
    }
    setLoading(btn,false,'<span>'+icon('doc')+' Excel</span>');
    toast('تم تصدير الملف بنجاح');
  }catch(err){
    console.error(err);
    setLoading(btn,false,'<span>'+icon('doc')+' Excel</span>');
    toast('تعذر التصدير، الرجاء التأكد من الاتصال بالإنترنت',true);
  }
}

/* نسخة من دالة تصغير الصور تدعم عرضاً مستطيلاً أكبر (لصور النشرة) بدل التربيع الثابت للصورة الرمزية */
function resizeImageFileToDataURL_rect(file, maxWidth, quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('read-failed'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('image-decode-failed'));
      img.onload=()=>{
        const ratio=Math.min(1, maxWidth/img.width);
        const w=Math.round(img.width*ratio), h=Math.round(img.height*ratio);
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality||0.75));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

      <div class="nl-stat-row">

          <div class="nl-stat-chip">

    </div>`:''}

    ${(n.events&&n.events.length)?`
    <div class="nl-section">
      <h2>${icon('calendar')} الفعاليات</h2>
      <ul class="nl-list">
        ${n.events.map(e=>`<li><strong>${esc(e.name)}</strong>${e.location?` <span class="nl-muted">— ${esc(e.location)}</span>`:''}</li>`).join('')}
      </ul>
    </div>`:''}

    ${(n.projectCoverage&&n.projectCoverage.length)?`
    <div class="nl-section">
      <h2>${icon('camera')} تغطية المشاريع</h2>
      <div class="nl-coverage-grid">
        ${n.projectCoverage.map(c=>`
          <div class="nl-coverage-item">
            <span>${esc(c.directorate)}</span>
            <strong>العدد ${c.count}</strong>
          </div>`).join('')}

    ${(n.photos&&n.photos.length)?`
    <div class="nl-section">
      <h2>${icon('film')} من ميدان العمل</h2>
      <div class="nl-photo-grid">
        ${n.photos.map(p=>`
          <figure class="nl-photo-frame">
            <img src="${p.dataUrl}" alt="">
            ${p.caption?`<figcaption>${esc(p.caption)}</figcaption>`:''}
          </figure>`).join('')}
      </div>
    </div>`:''}

    <div class="nl-footer">دائرة الفعاليات والتوعية — بلدية مسقط · ${esc(n.periodLabel||n.period)}</div>
  </div>
  `;
}
function wireNewsletterView(id){
  $all('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
  const pb=$('#printNlBtn');
  if(pb) pb.addEventListener('click',()=>window.print());
  const eb=$('#editNlBtn');
  if(eb) eb.addEventListener('click',()=>go('portal-newsletter-edit', id));
  const db2=$('#deleteNlBtn');
  if(db2) db2.addEventListener('click',async()=>{
    if(!confirm('حذف هذا الإصدار نهائياً؟')) return;
    try{
      await deleteDoc(doc(db,'newsletters',id));
      toast('تم حذف الإصدار');
      go('portal-newsletters');
    }catch(err){ console.error(err); toast('تعذر الحذف',true); }
  });
}
function wireReports(){
  if(S.user.role!=='lead') return;
  $all('[data-rtype]').forEach(b=>b.addEventListener('click',()=>{
    S.filters.reportType=b.dataset.rtype;
    if(b.dataset.rtype==='quarter') S.filters.reportValue=`${new Date().getFullYear()}-Q${currentQuarter()}`;
    else if(b.dataset.rtype==='year') S.filters.reportValue=String(new Date().getFullYear());
    else S.filters.reportValue=todayISO().slice(0,7);
    render();
  }));
  const mi=$('#reportMonthInput');
  if(mi) mi.addEventListener('change',()=>{ S.filters.reportValue=mi.value; refreshReportBody(); });
  const ys=$('#reportYearSelect'), qs=$('#reportQuarterSelect');
  if(ys&&qs){ const upd=()=>{ S.filters.reportValue=`${ys.value}-Q${qs.value}`; refreshReportBody(); }; ys.addEventListener('change',upd); qs.addEventListener('change',upd); }
  const yos=$('#reportYearOnlySelect');
  if(yos) yos.addEventListener('change',()=>{ S.filters.reportValue=yos.value; refreshReportBody(); });
  const empSelect=$('#empSelectDropdown');
  if(empSelect) empSelect.addEventListener('change',()=>{
    S.filters.reportSelectedEmpId=empSelect.value||null;
    render();
  });
  wireReportBodyInteractions();
  const pb=$('#printReportBtn');
  if(pb) pb.addEventListener('click',()=>window.print());
  const xb=$('#exportExcelBtn');
  if(xb) xb.addEventListener('click',exportReportToExcel);
}
function runBackupExport(){
  const data={
    exportedAt:new Date().toISOString(), project:'فريق التصوير - بلدية مسقط',
    employees:S.employees, requests:S.requests, visits:S.visits, meetings:S.meetings
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`نسخة-احتياطية-فريق-التصوير-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('تم تنزيل النسخة الاحتياطية');
}

   حسابي - تغيير الرقم السري

function renderAccount(){
  const forced=S.user.mustChangePassword;
  return `
  <div class="section-title-row"><h2>حسابي</h2></div>
  ${forced?`
  <div class="section" style="margin-bottom:14px;border-color:var(--gold-500)">
    <div class="section-body" style="display:flex;gap:10px;align-items:flex-start">
      <span style="color:var(--gold-600);flex:none">${icon('alert')}</span>
      <p style="font-size:13px;line-height:1.7;color:var(--ink-700)">حسابك يستخدم الرقم السري الافتراضي، الرجاء تغييره الآن قبل المتابعة</p>
    </div>
  </div>`:''}
  <div class="section" style="margin-bottom:14px">
    <div class="section-body" style="display:flex;align-items:center;gap:16px">
      <div class="avatar-sm" style="width:64px;height:64px;font-size:22px">${avatarInner(S.user)}</div>
      <div style="flex:1">
        <button type="button" class="btn btn-outline btn-sm" id="changePhotoBtn">${icon('edit')} تغيير الصورة</button>
        ${S.user.photoData?`<button type="button" class="btn btn-ghost btn-sm" id="removePhotoBtn">إزالة</button>`:''}
        <input type="file" id="photoFileInput" accept="image/*" style="display:none">
        <div class="hint" style="margin-top:6px">صورة مربعة بجودة جيدة تعطي أفضل نتيجة</div>
      </div>
    </div>
  </div>
  <div class="section" style="margin-bottom:14px">
    <div class="section-head">${icon('id')} البيانات الشخصية</div>
    <div class="section-body">
      ${S.user.role==='lead'?`
      <form id="profileForm">
        <div class="field"><label>الاسم الثلاثي</label><input class="input" name="name" value="${esc(S.user.name||'')}" required></div>
        <div class="field"><label>المسمى الوظيفي</label><input class="input" name="jobTitle" value="${esc(S.user.jobTitle||'')}" placeholder="مثال: مصور فوتوغرافي"></div>
        <div class="field"><label>الصفة</label><input class="input" name="capacity" value="${esc(S.user.capacity||'')}"></div>
        <div class="kv"><span class="k">الرقم الوظيفي</span><span class="v">${esc(S.user.employeeNumber)}</span></div>
        <div class="kv" style="margin-bottom:14px"><span class="k">الصلاحية</span><span class="v">مشرف</span></div>
        <button class="btn btn-primary" type="submit">${icon('check')} حفظ البيانات</button>
      </form>`:`
      <div class="kv"><span class="k">الاسم الثلاثي</span><span class="v">${esc(S.user.name||'')}</span></div>
      <div class="kv"><span class="k">المسمى الوظيفي</span><span class="v">${esc(S.user.jobTitle||'—')}</span></div>
      <div class="kv"><span class="k">الصفة</span><span class="v">${esc(S.user.capacity||'—')}</span></div>
      <div class="kv"><span class="k">الرقم الوظيفي</span><span class="v">${esc(S.user.employeeNumber)}</span></div>
      <div class="kv" style="margin-bottom:0"><span class="k">الصلاحية</span><span class="v">عضو الفريق</span></div>
      <p class="hint" style="margin-top:12px">لتعديل هذه البيانات أو تصحيحها، الرجاء التواصل مع المشرف</p>
      `}
    </div>
  </div>
  <div class="section"><div class="section-head">${icon('key')} تغيير الرقم السري</div>
    <div class="section-body">
      <form id="pwForm">
        <div class="field">
          <label>الرقم السري الحالي</label>
          <input class="input" type="password" name="cur" required>
          ${forced?'<div class="hint">إذا لم يتم تغييره بعد، فهو 123456</div>':''}
        </div>
        <div class="field" style="margin-bottom:0"><label>الرقم السري الجديد</label><input class="input" type="password" name="next" minlength="6" required></div>
        <div class="err-text" id="pwErr" style="display:none"></div>
        <button class="btn btn-primary" type="submit" style="margin-top:14px">${icon('check')} تحديث الرقم السري</button>
      </form>

}
function wireAccount(){
  $('#changePhotoBtn').addEventListener('click',()=>$('#photoFileInput').click());
  $('#photoFileInput').addEventListener('change', async (e)=>{
    const file=e.target.files[0];
    if(!file) return;
    const btn=$('#changePhotoBtn');
    setLoading(btn,true);
    try{
      const dataUrl=await resizeImageFileToDataURL(file, 200);
      if(dataUrl.length>900000){ throw new Error('too-large'); }
      await updateDoc(doc(db,'employees',S.user.id),{photoData:dataUrl});
      S.user.photoData=dataUrl;
      toast('تم تحديث الصورة بنجاح');
      render();
    }catch(err){
      console.error(err);
      setLoading(btn,false,'<span>'+icon('edit')+' تغيير الصورة</span>');
      toast(err.message==='too-large'?'الصورة كبيرة جداً، جرّبي صورة أخرى':'تعذر رفع الصورة',true);
    }
  });
  const rmBtn=$('#removePhotoBtn');
  if(rmBtn) rmBtn.addEventListener('click',async()=>{
    setLoading(rmBtn,true);
    try{
      await updateDoc(doc(db,'employees',S.user.id),{photoData:''});
      S.user.photoData='';
      toast('تمت إزالة الصورة');
      render();
    }catch(err){
      console.error(err);
      setLoading(rmBtn,false,'إزالة');
      toast('تعذر الحذف',true);
    }
  });
  const profileForm=$('#profileForm');
  if(profileForm) profileForm.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const btn=e.target.querySelector('[type=submit]');
    const newName=(fd.get('name')||'').trim(), newJobTitle=(fd.get('jobTitle')||'').trim(), newCapacity=(fd.get('capacity')||'').trim();
    setLoading(btn,true);
    try{
      await updateDoc(doc(db,'employees',S.user.id),{name:newName, jobTitle:newJobTitle, capacity:newCapacity});
      S.user.name=newName; S.user.jobTitle=newJobTitle; S.user.capacity=newCapacity;
      toast('تم حفظ البيانات بنجاح');
      setLoading(btn,false,'<span>'+icon('check')+' حفظ البيانات</span>');
      render();
    }catch(err){
      console.error(err);
      setLoading(btn,false,'<span>'+icon('check')+' حفظ البيانات</span>');
      toast('تعذر الحفظ',true);
    }
  });
  $('#pwForm').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const errEl=$('#pwErr'); errEl.style.display='none';
    const fd=new FormData(e.target);
    const btn=e.target.querySelector('[type=submit]');
    setLoading(btn,true);
    try{
      const cred=EmailAuthProvider.credential(S.fbUser.email, fd.get('cur'));
      await reauthenticateWithCredential(S.fbUser, cred);
      await updatePassword(S.fbUser, fd.get('next'));
      if(S.user.mustChangePassword){
        await updateDoc(doc(db,'employees',S.user.id),{mustChangePassword:false});
      }
      toast('تم تحديث الرقم السري بنجاح');
      e.target.reset();
      setLoading(btn,false,'<span>'+icon('check')+' تحديث الرقم السري</span>');
    }catch(err){
      console.error(err);
      setLoading(btn,false,'<span>'+icon('check')+' تحديث الرقم السري</span>');
      errEl.textContent='الرقم السري الحالي غير صحيح'; errEl.style.display='block';
    }
  });
}
